name: FIPS GitHub CI

on:
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx2g -Daether.connector.basic.threads=8 -Daether.metadataResolver.threads=8 -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3 -Dorg.slf4j.simpleLogger.showDateTime=true -Dorg.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss,SSS -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dspotless.apply.skip=true

jobs:
  build:
    # The runner kernel is not booted with fips=1, so this job cannot test kernel FIPS mode: the
    # fips-test profile stands in for it, putting BouncyCastle in approved-only mode and hiding
    # the JDK services a FIPS system does not have. The FIPS virtual machine, described in the
    # FIPS notes, is what checks that stand-in still matches the real thing.
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v7
      with:
        # 500 commits, set to 0 to get all
        fetch-depth: 500
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: 'temurin'
    - name: Set up Maven
      uses: stCarolas/setup-maven@v5.1
      with:
        maven-version: 3.9.16
    - name: Maven repository caching
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        # Own key: this build resolves the FIPS BouncyCastle line, which the other jobs must not
        # pick up from a shared cache.
        key: gs-fips-${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          gs-fips-${{ runner.os }}-maven-
    - name: Build with Maven in FIPS mode
      run: |
        mvn --version
        mvn -B -ntp -U -T1C -fae -Prelease,fips,fips-test -f src/pom.xml clean install
    - name: Remove SNAPSHOT jars from repository
      if: always()
      run: |
        find ~/.m2/repository -name "*SNAPSHOT*" -type d | xargs rm -rf {}
