UpdatesCheckerPage.title=Check for Updates
UpdatesCheckerPage.description=Keep your GeoServer version up to date, by displaying routine and critical updates as early as possible.<br/><br/>The version feed is a static file on GitHub (raw.githubusercontent.com); the public jsDelivr content delivery network (cdn.jsdelivr.net) can be used where that host is unreachable. The GeoServer team does not run these hosts and receives no request logs at all. We cannot see which GeoServer versions are running. This module sends nothing about your server. However the feed host can see the public IP address of your server making the request.
