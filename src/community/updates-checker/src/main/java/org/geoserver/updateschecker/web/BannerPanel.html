<?xml version="1.0"?>
<html xmlns:wicket="http://wicket.apache.org/">
  <body>
    <wicket:panel>
      <div wicket:id="root" class="gs-updates-checker-notifications" data-banner="true">
        <ul class="feedbackPanel">
          <li wicket:id="notification"><wicket:container wicket:id="line"></wicket:container></li>
        </ul>
        <p class="gs-updates-checker-more">
          <a wicket:id="more"><span wicket:id="moreCount" class="gs-updates-checker-more-count">1</span>&#160;<wicket:message key="UpdatesChecker.moreNotices">more notices</wicket:message></a>
        </p>
      </div>
    </wicket:panel>
  </body>
</html>
