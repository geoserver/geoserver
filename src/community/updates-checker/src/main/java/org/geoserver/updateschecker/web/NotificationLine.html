<html xmlns:wicket="http://wicket.apache.org/">
  <body>
    <wicket:panel>
      <strong wicket:id="label" class="gs-updates-checker-label">WARN</strong>
      <span class="gs-updates-checker-dash">&#8212;</span>
      <span wicket:id="message">Notification text</span>
      <span wicket:id="details"><span class="gs-updates-checker-sep">&#160;&#183;&#160;</span><a wicket:id="link" target="_blank" rel="noopener noreferrer"><wicket:message key="UpdatesChecker.details">Details</wicket:message></a></span>
      <span wicket:id="action"><span class="gs-updates-checker-sep">&#160;&#183;&#160;</span><a wicket:id="actionLink" href="#"><span wicket:id="actionText">Remind me tomorrow</span></a></span>
    </wicket:panel>
  </body>
</html>
