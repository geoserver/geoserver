<?xml version="1.0"?>
<html xmlns:wicket="http://wicket.apache.org/">
  <body>
    <wicket:panel>
      <div wicket:id="root" class="gs-updates-checker-status">
        <fieldset>
          <legend><span><wicket:message key="UpdatesChecker.status.title">Status</wicket:message></span></legend>
          <div class="gs-form">
            <p wicket:id="error" class="feedbackPanelERROR">Check failed</p>
            <p wicket:id="header">You are currently running version 2.27.0</p>
            <p class="gs-updates-checker-check-line">
              <a wicket:id="checkNow" href="#" class="button outline-primary gs-updates-checker-check-now"><span class="gs-updates-checker-idle"><wicket:message key="UpdatesCheckerPage.checkNow">Check now</wicket:message></span><span class="gs-updates-checker-working"><wicket:message key="UpdatesCheckerPage.checking">Checking ...</wicket:message></span></a>
              <span wicket:id="feedLine" class="gs-updates-checker-feed-line">Feed checked</span>
            </p>
            <p wicket:id="suppressed">Suppressed by the server configuration: CVE-2026-0001.</p>
            <p wicket:id="none" class="gs-updates-checker-none"><wicket:message key="UpdatesChecker.status.none">No notifications are active.</wicket:message></p>
            <ul class="feedbackPanel">
              <li wicket:id="notification"><wicket:container wicket:id="line"></wicket:container></li>
            </ul>
            <p wicket:id="clear" class="gs-updates-checker-clear" hidden="hidden"><a href="#" data-clear="true"></a></p>
          </div>
        </fieldset>
      </div>
    </wicket:panel>
  </body>
</html>
