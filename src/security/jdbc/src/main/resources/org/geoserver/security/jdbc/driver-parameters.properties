# Connection URL parameters accepted per JDBC driver, keyed by driver class name.
# The JDBC security services reject a driver missing from this file, and reject any
# connection URL parameter missing from its driver's list.
#
# The lists hold commonly used connection parameters from each driver's documentation.
# Names are compared ignoring case.
#
# A site can add parameters at runtime with the GEOSERVER_JDBC_EXTRA_PARAMETERS property
# ("driverClass:p1,p2;driverClass2:p3"); that only adds, it never removes an entry.

